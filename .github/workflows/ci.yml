name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test-lint-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy src/acat_x lightweight_eval.py run_evaluation.py production_pipeline.py monitoring_dashboard.py
      - name: Pytest
        run: uv run pytest -q
