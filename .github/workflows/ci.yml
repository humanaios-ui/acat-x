name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  test-lint-typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy lightweight_eval.py src/acat_x/errors.py src/acat_x/scoring_utils.py
      - name: Pytest
        run: uv run pytest -q
