[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "acat-x"
version = "0.1.0"
description = "ACAT-X: Inspect AI evaluation suite for behavioral assessment and self-description calibration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "HumanAIOS", email = "team@humanaios.ai"}
]
keywords = ["evaluation", "ai", "behavioral-assessment", "calibration", "inspect"]

dependencies = [
  "inspect_ai>=0.3.251",
  "anthropic>=0.25.0",
  "openai>=1.40.0",
  "tabulate>=0.9.0",
  "sentence-transformers>=3.0.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-asyncio>=0.21.0",
  "ruff>=0.1.0",
  "mypy>=1.0",
]

[project.urls]
Repository = "https://github.com/humanaios-ui/acat-x"
Documentation = "https://github.com/humanaios-ui/acat-x"

[tool.hatch.build.targets.wheel]
packages = ["src/acat_x"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["phase8_stage5_analysis.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = false
ignore_missing_imports = true
